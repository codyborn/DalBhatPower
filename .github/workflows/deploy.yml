name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check frontend and functions code
        run: |
          for f in public/*.js; do cp "$f" "/tmp/$(basename "$f" .js).mjs"; node --check "/tmp/$(basename "$f" .js).mjs"; done
          node --check functions/index.js
          python3 scripts/check_js.py public/*.js

      - name: Install function dependencies
        run: npm install --no-audit --no-fund
        working-directory: functions

      - name: Stamp app version
        run: sed -i "s/__APP_VERSION__/${GITHUB_SHA::7}/" public/app.js public/sw.js

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy hosting, rules, indexes and functions
        run: npx --yes firebase-tools@latest deploy --project dalbhatpower-fa19c --non-interactive --force
